name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Requis par l'émulateur Firestore.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm run typecheck
      - name: Tests unitaires (logique métier)
        run: npm test
      - name: Tests des règles de sécurité Firestore (émulateur)
        run: npm run test:rules
      - run: npm run build
