[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA : toutes les routes servent index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    # Seuls l'app elle-même, Firebase (Auth, Firestore, App Check), reCAPTCHA et Google Fonts sont autorisés.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://apis.google.com https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; connect-src 'self' https://*.googleapis.com https://www.google.com/recaptcha/; frame-src https://fitnessboii-fb4d3.firebaseapp.com https://accounts.google.com https://www.google.com/recaptcha/ https://recaptcha.google.com/recaptcha/; img-src 'self' blob: data: https://*.googleusercontent.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    # Popup Google : la fenêtre d'auth doit pouvoir répondre à l'app.
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

# Les fichiers versionnés par Vite peuvent être mis en cache longtemps.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Le service worker doit toujours être revalidé pour que les mises à jour arrivent.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
